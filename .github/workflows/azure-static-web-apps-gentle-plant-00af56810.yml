name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # Production deployment job - runs only on pushes to main
  production_deploy_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Production Deploy Job
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Portfolio/package-lock.json
      
      - name: Install dependencies
        run: |
          cd Portfolio
          npm ci
      
      - name: Auto-increment version
        run: |
          cd Portfolio
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          npm run version:auto
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")" || exit 0
          git push
      
      - name: Build And Deploy to Production
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_PLANT_00AF56810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "Portfolio/"
          api_location: ""
          output_location: "dist/portfolio/browser"
          config_file_location: "/Portfolio/src/"
          ###### End of Repository/Build Configurations ######

  # Preview deployment job - runs only on pull requests
  preview_deploy_job:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Preview Deploy Job
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Build And Deploy Preview Environment
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_PLANT_00AF56810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "Portfolio/"
          api_location: ""
          output_location: "dist/portfolio/browser"
          config_file_location: "/Portfolio/src/"
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_PLANT_00AF56810 }}
          action: "close"
